workflows:
  android_apk:
    name: Build Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Inspect project
        script: |
          set -e
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort | head -200

      - name: Build APK
        script: |
          set -e
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "build.gradle" ] || [ -f "settings.gradle" ]; then
            gradle assembleDebug --stacktrace
          elif [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter build apk --debug
          else
            echo "No supported Android or Flutter project found at repository root."
            exit 1
          fi

      - name: Collect APK
        script: |
          mkdir -p artifacts
          find . -type f -name "*.apk" -exec cp {} artifacts/ \;
          ls -la artifacts

    artifacts:
      - artifacts/*.apk
      - app/build/outputs/**/*.apk
      - build/app/outputs/**/*.apk
