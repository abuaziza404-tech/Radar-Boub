name: Build BOUH Terrain Radar V52.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/build-v52-integrated-apk.yml'
      - 'BUILD_REPORT.md'
      - 'RELEASE_NOTES.md'
      - 'README_AR.md'
      - 'package.json'
      - 'index.html'
      - 'main.js'
      - 'styles.css'
      - 'capacitor.config.json'
      - 'bouh_v52_1_manifest.json'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      APP_DIR: .
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd
          ls -lah

          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json not found in repository root"
            exit 1
          fi

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found in repository root"
            exit 1
          fi

          mkdir -p public/data

          if [ -f "bouh_v52_1_manifest.json" ] && [ ! -f "public/data/bouh_v52_1_manifest.json" ]; then
            cp bouh_v52_1_manifest.json public/data/bouh_v52_1_manifest.json
          fi

          if [ ! -f "public/data/bouh_v52_1_manifest.json" ]; then
            cat > public/data/bouh_v52_1_manifest.json <<'JSON'
          {
            "app": "BOUH Terrain Radar V52.1 Final Field Pro",
            "version": "52.1.0",
            "ground_cells": 25027,
            "status": "field_command_integrated",
            "developer": "Ahmed Abu Aziza Al-Rashidi"
          }
          JSON
          fi

          if [ ! -f "capacitor.config.json" ]; then
            cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.bouh.terrainradar",
            "appName": "BOUH Terrain Radar V52.1",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          JSON
          fi

      - name: Install dependencies and fix Rollup optional modules
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf node_modules package-lock.json npm-shrinkwrap.json
          npm cache verify

          npm install --include=optional --legacy-peer-deps

          npm install --save-dev --include=optional --legacy-peer-deps \
            vite@5.4.21 \
            typescript@5.7.3 \
            postcss@8.4.49 \
            autoprefixer@10.4.20

          npm install --save --include=optional --legacy-peer-deps \
            @capacitor/core@6.2.1 \
            @capacitor/cli@6.2.1 \
            @capacitor/android@6.2.1 \
            @capacitor/geolocation@6.1.0 \
            @capacitor/preferences@6.0.3 \
            @capacitor/filesystem@6.0.3

          npm rebuild rollup || true

          node --version
          npm --version
          node -e "console.log('vite', require('vite/package.json').version)"
          node -e "console.log('capacitor', require('@capacitor/cli/package.json').version)"

      - name: Verify BOUH manifest
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('public/data/bouh_v52_1_manifest.json')
          if not p.exists():
              raise SystemExit('Missing public/data/bouh_v52_1_manifest.json')

          d = json.loads(p.read_text(encoding='utf-8'))

          assert d.get('ground_cells') == 25027, d.get('ground_cells')
          assert d.get('version') == '52.1.0', d.get('version')

          print('BOUH V52.1 manifest OK:', d['ground_cells'], 'cells')
          PY

      - name: Build web assets
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if npm run | grep -q " build"; then
            npm run build
          else
            npx vite build
          fi

      - name: Add and sync Capacitor Android
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android || true
          npx cap sync android

          test -d android
          test -f android/gradlew

      - name: Build Debug APK
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build Release AAB
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Collect outputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p BOUH_V52_1_ANDROID_OUTPUTS

          find android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} BOUH_V52_1_ANDROID_OUTPUTS/ \;
          find android/app/build/outputs/bundle -type f -name '*.aab' -exec cp {} BOUH_V52_1_ANDROID_OUTPUTS/ \;

          cp BUILD_REPORT.md BOUH_V52_1_ANDROID_OUTPUTS/ || true
          cp RELEASE_NOTES.md BOUH_V52_1_ANDROID_OUTPUTS/ || true
          cp README_AR.md BOUH_V52_1_ANDROID_OUTPUTS/ || true
          cp public/data/bouh_v52_1_manifest.json BOUH_V52_1_ANDROID_OUTPUTS/ || true

          APK_COUNT="$(find BOUH_V52_1_ANDROID_OUTPUTS -type f -name '*.apk' | wc -l | tr -d ' ')"
          AAB_COUNT="$(find BOUH_V52_1_ANDROID_OUTPUTS -type f -name '*.aab' | wc -l | tr -d ' ')"

          echo "APK_COUNT=$APK_COUNT"
          echo "AAB_COUNT=$AAB_COUNT"

          test "$APK_COUNT" -ge 1
          test "$AAB_COUNT" -ge 1

          (
            cd BOUH_V52_1_ANDROID_OUTPUTS
            sha256sum * > CHECKSUMS.txt
          )

          zip -qr BOUH_TERRAIN_RADAR_V52_1_FINAL_FIELD_PRO_ANDROID_OUTPUTS.zip BOUH_V52_1_ANDROID_OUTPUTS

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-RADAR-V52-1-APK-AAB
          path: BOUH_V52_1_ANDROID_OUTPUTS/*
          if-no-files-found: error

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_TERRAIN_RADAR_V52_1_FINAL_FIELD_PRO_ANDROID_OUTPUTS
          path: BOUH_TERRAIN_RADAR_V52_1_FINAL_FIELD_PRO_ANDROID_OUTPUTS.zip
          if-no-files-found: error
