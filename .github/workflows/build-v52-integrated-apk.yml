name: Build BOUH Terrain Radar V52.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/build-v52-integrated-apk.yml'
      - 'BUILD_REPORT.md'
      - 'RELEASE_NOTES.md'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      APP_DIR: apps/web
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and fix Rollup optional modules
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json npm-shrinkwrap.json
          npm cache verify
          npm install --include=optional --legacy-peer-deps
          npm rebuild rollup || true
          node --version
          npm --version
          node -e "console.log('vite', require('vite/package.json').version)"

      - name: Verify BOUH manifest
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/data/bouh_v52_1_manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['ground_cells']==25027, d['ground_cells']
          assert d['version']=='52.1.0', d['version']
          print('BOUH V52.1 manifest OK:', d['ground_cells'], 'cells')
          PY

      - name: Build web assets
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: npm run build

      - name: Add/sync Capacitor Android
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build Release AAB
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Collect outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p BOUH_V52_1_ANDROID_OUTPUTS
          find apps/web/android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} BOUH_V52_1_ANDROID_OUTPUTS/ \;
          find apps/web/android/app/build/outputs/bundle -type f -name '*.aab' -exec cp {} BOUH_V52_1_ANDROID_OUTPUTS/ \;
          cp BUILD_REPORT.md RELEASE_NOTES.md README_AR.md BOUH_V52_1_ANDROID_OUTPUTS/ || true
          (cd BOUH_V52_1_ANDROID_OUTPUTS && sha256sum * > CHECKSUMS.txt)
          zip -qr BOUH_TERRAIN_RADAR_V52_1_FINAL_FIELD_PRO_ANDROID_OUTPUTS.zip BOUH_V52_1_ANDROID_OUTPUTS

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-RADAR-V52-1-APK-AAB
          path: BOUH_V52_1_ANDROID_OUTPUTS/*
          if-no-files-found: error

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_TERRAIN_RADAR_V52_1_FINAL_FIELD_PRO_ANDROID_OUTPUTS
          path: BOUH_TERRAIN_RADAR_V52_1_FINAL_FIELD_PRO_ANDROID_OUTPUTS.zip
          if-no-files-found: error
