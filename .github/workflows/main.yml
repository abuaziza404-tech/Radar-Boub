name: Build BOUH Terrain Radar V50 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build V50 Field Command Pro APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare project from ZIP if needed
        shell: bash
        run: |
          set -e
          echo "Checking repository structure..."

          # إذا رفعت حزمة ZIP في جذر المستودع، سيقوم بفكها تلقائياً.
          if [ ! -f "settings.gradle" ]; then
            ZIP_FILE=""
            if [ -f "BOUH_TERRAIN_RADAR_V50_FIELD_COMMAND_PRO_GITHUB_ROOT_READY.zip" ]; then
              ZIP_FILE="BOUH_TERRAIN_RADAR_V50_FIELD_COMMAND_PRO_GITHUB_ROOT_READY.zip"
            else
              ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: لم أجد settings.gradle ولا ملف ZIP في جذر المستودع."
              exit 1
            fi

            echo "Unzipping: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

          echo "Project files:"
          ls -la
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Make Gradle wrapper available
        shell: bash
        run: |
          set -e
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --version
          else
            echo "No Gradle wrapper found; installing Gradle via setup-gradle."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          if [ -f "gradlew" ]; then
            ./gradlew clean :app:assembleDebug --stacktrace --no-daemon
          else
            gradle clean :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Rename APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: لم يتم العثور على APK بعد البناء."
            exit 1
          fi
          cp "$APK" "output/BOUH_TERRAIN_RADAR_V50_FIELD_COMMAND_PRO_DEBUG.apk"
          ls -lh output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_TERRAIN_RADAR_V50_FIELD_COMMAND_PRO_APK
          path: output/BOUH_TERRAIN_RADAR_V50_FIELD_COMMAND_PRO_DEBUG.apk
          if-no-files-found: error
