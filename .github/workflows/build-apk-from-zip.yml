name: Build BOUH Terrain Radar APK From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find ZIP package in repository root
        run: |
          echo "Repository root files:"
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            echo "Upload BOUH_TERRAIN_RADAR_V32_SUPREME_AI_CORE_MERGED_GITHUB_ROOT_READY.zip to the repository root."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Found ZIP: $ZIP_FILE"

      - name: Extract ZIP package
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 4 -type f | sort

      - name: Detect Android project
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle" -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle not found inside ZIP."
            echo "The ZIP must contain the Android project files."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Verify required Android files
        run: |
          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/bouh/terrainradar/v32/MainActivity.java
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/databases/BOUH_V30_REAL_3ZONES.db

          echo "Required Android project files OK"

      - name: Install SQLite and check database
        run: |
          sudo apt-get install -y sqlite3
          cd "$PROJECT_DIR"
          sqlite3 app/src/main/assets/databases/BOUH_V30_REAL_3ZONES.db "PRAGMA integrity_check;"

      - name: Check no random logic
        run: |
          cd "$PROJECT_DIR"

          if grep -R "Math.random\|new Random\|Random(" -n app/src/main; then
            echo "Forbidden random logic found."
            exit 1
          fi

          echo "No random logic found."

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Terrain-Radar-V32-Supreme-AI-Core-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
