name: Build BOUH Geo Radar AI APK From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find uploaded ZIP
        run: |
          echo "Repository root:"
          ls -lah
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Found ZIP: $ZIP_FILE"

      - name: Extract project
        run: |
          unzip -o "$ZIP_FILE" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort

      - name: Detect Android project folder
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android project detected at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify required files
        run: |
          cd "$PROJECT_DIR"
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java
          echo "Required Android files OK"

      - name: Verify no Math.random
        run: |
          cd "$PROJECT_DIR"
          if grep -R "Math.random" -n app/src/main || true; then
            echo "Math.random check completed"
          fi
          if grep -R "Math.random" -n app/src/main; then
            echo "Forbidden Math.random found"
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper || true
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-GEO-RADAR-AI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
