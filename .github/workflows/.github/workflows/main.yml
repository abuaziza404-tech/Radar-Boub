      - name: Verify BOUH package structure
        shell: bash
        run: |
          set -euo pipefail
          test -d "$APP_DIR" || (echo "Missing android_webview folder" && exit 1)
          test -f "$APP_DIR/settings.gradle" || (echo "Missing settings.gradle" && exit 1)
          test -f "$APP_DIR/build.gradle" || (echo "Missing android_webview/build.gradle" && exit 1)
          test -f "$APP_DIR/app/build.gradle" || (echo "Missing app/build.gradle" && exit 1)
          test -f "$APP_DIR/app/src/main/assets/index.html" || (echo "Missing offline app asset index.html" && exit 1)
          test -f "engine/bouh_engine_standalone.py" || (echo "Missing standalone Python engine" && exit 1)
          python3 engine/bouh_engine_standalone.py samples/sample_targets.csv --out outputs/ci_results --format all
          echo "BOUH package structure and engine test are valid."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$APP_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK and collect outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$APP_DIR/app/build/outputs/apk/debug/app-debug.apk" "release/$APK_NAME"
          cp -r outputs release/BOUH_outputs
          ls -lh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_LOCAL_STANDALONE_APK_ONE_FILE
          path: release/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Upload BOUH generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_ENGINE_OUTPUTS_CSV_JSON_KML_KMZ
          path: release/BOUH_outputs/**
          if-no-files-found: warn
