name: Build BOUH Local Standalone APK - One File

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  APP_DIR: android_webview
  APK_NAME: BOUH_LOCAL_STANDALONE_v6_ONE_FILE.apk

jobs:
  build-apk:
    name: Decode embedded BOUH package and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Recreate BOUH standalone package from this workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > bouh_embedded_package.b64 <<'BOUH_PACKAGE_BASE64'
