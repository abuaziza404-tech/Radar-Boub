name: Build BOUH Terrain Radar V45.1 APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK from ZIP in repository root
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate ZIP package
        id: locate_zip
        shell: bash
        run: |
          set -e

          echo "Searching for BOUH V45/V45.1 ZIP package in repository root..."

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*V45*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No V45 ZIP found. Searching for any ZIP..."
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            echo "Upload this file to repository root:"
            echo "BOUH_TERRAIN_RADAR_V45_1_PRO_COMMAND_INTERFACE_GITHUB_ROOT_READY.zip"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP package
        shell: bash
        run: |
          set -e

          rm -rf extracted_app
          mkdir -p extracted_app

          echo "Extracting: ${{ steps.locate_zip.outputs.zip_file }}"
          unzip -q "${{ steps.locate_zip.outputs.zip_file }}" -d extracted_app

          echo "Extracted preview:"
          find extracted_app -maxdepth 3 -type f | sort | head -n 120

      - name: Locate Android Gradle project
        id: locate_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find extracted_app -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -exec dirname {} \; | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts inside ZIP."
            exit 1
          fi

          echo "Android project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate Android project
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -e

          echo "Validating Android project structure..."

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f settings.gradle || test -f settings.gradle.kts

          MAIN_ACTIVITY="$(find app/src/main/java -name 'MainActivity.java' | head -n 1)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found."
            exit 1
          fi

          echo "MainActivity found: $MAIN_ACTIVITY"

      - name: Validate SQLite database
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y sqlite3

          DB_FILE="$(find app/src/main/assets/databases -name '*.db' | head -n 1)"

          if [ -z "$DB_FILE" ]; then
            echo "SQLite database not found under app/src/main/assets/databases"
            exit 1
          fi

          echo "Database found: $DB_FILE"

          RESULT="$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')"
          echo "SQLite integrity_check: $RESULT"

          if [ "$RESULT" != "ok" ]; then
            echo "SQLite database integrity check failed."
            exit 1
          fi

          echo "Cells count:"
          sqlite3 "$DB_FILE" 'SELECT COUNT(*) FROM cells;'

      - name: Print version information
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -e

          echo "Gradle version fields:"
          grep -n "applicationId\|namespace\|versionCode\|versionName" app/build.gradle || true

          echo "App name:"
          cat app/src/main/res/values/strings.xml || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Make Gradle wrapper executable if present
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found. System Gradle will be used."
          fi

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew clean :app:assembleDebug --stacktrace
          else
            gradle clean :app:assembleDebug --stacktrace
          fi

      - name: Locate generated APK
        id: locate_apk
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -e

          APK_FILE="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "No APK file generated."
            exit 1
          fi

          echo "APK generated: $APK_FILE"
          echo "apk_file=${{ steps.locate_project.outputs.project_dir }}/$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-RADAR-V45-1-PRO-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_file }}
          if-no-files-found: error
