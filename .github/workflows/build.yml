name: Build BOUH-ZVT V57 Hybrid Commander Payload

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Unzip V57 payload and build APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate payload zip
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \( -name 'BOUH_ZVT_V57_HYBRID_COMMANDER_PAYLOAD_NO_UNZIP.zip' -o -name 'BOUH_ZVT_PRO_FIELD_APP_PAYLOAD_NO_UNZIP_FIXED.zip' \) | sort | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Payload zip not found"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found payload: $ZIP"

      - name: Extract payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/_payload_src"
          mkdir -p "$GITHUB_WORKSPACE/_payload_src"
          unzip -q "${{ steps.payload.outputs.zip }}" -d "$GITHUB_WORKSPACE/_payload_src"
          SRC="$(find "$GITHUB_WORKSPACE/_payload_src" -maxdepth 3 -type f -name 'pubspec.yaml' -printf '%h\n' | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "pubspec.yaml not found after unzip"
            find "$GITHUB_WORKSPACE/_payload_src" -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "BOUH_SRC=$SRC" >> "$GITHUB_ENV"
          echo "Source root: $SRC"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$BOUH_SRC"
          flutter pub get

      - name: Analyze Dart code non-fatal warnings
        shell: bash
        run: |
          set -euo pipefail
          cd "$BOUH_SRC"
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$BOUH_SRC"
          flutter build apk --debug

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$BOUH_SRC"
          flutter build apk --release

      - name: Build release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$BOUH_SRC"
          flutter build appbundle --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-ZVT-V57-debug-apk
          path: ${{ env.BOUH_SRC }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-ZVT-V57-release-apk
          path: ${{ env.BOUH_SRC }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-ZVT-V57-release-aab
          path: ${{ env.BOUH_SRC }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
