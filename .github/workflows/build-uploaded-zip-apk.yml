name: Build AbuAziza AI APK From Uploaded ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "AbuAziza_AI_Source_UPLOAD_THIS_ZIP.zip"
      - ".github/workflows/build-uploaded-zip-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify uploaded ZIP exists
        run: |
          if [ ! -f "AbuAziza_AI_Source_UPLOAD_THIS_ZIP.zip" ]; then
            echo "ERROR: AbuAziza_AI_Source_UPLOAD_THIS_ZIP.zip not found in repository root."
            echo "Please upload the ZIP file to the root of your GitHub repository."
            exit 1
          fi

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract source ZIP
        run: |
          rm -rf source
          mkdir source
          unzip -q AbuAziza_AI_Source_UPLOAD_THIS_ZIP.zip -d source
          echo "Extracted files:"
          find source -maxdepth 3 -type f | head -80

      - name: Detect Android project root
        id: detect
        run: |
          PROJECT_DIR=""

          if [ -f "source/settings.gradle.kts" ] || [ -f "source/settings.gradle" ]; then
            PROJECT_DIR="source"
          else
            FOUND=$(find source -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts inside ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Android project root: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: |
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Find APK files
        run: |
          cd "$PROJECT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find . -type f -name "*.apk" -print -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          echo "APK output:"
          ls -lah "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbuAzizaAI-ZipUpload-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
