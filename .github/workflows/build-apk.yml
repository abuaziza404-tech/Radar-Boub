name: Build BOUH Native Offline APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify native no-HTML architecture
        run: |
          test ! -f app/src/main/assets/index.html
          ! grep -R "WebView\|loadUrl\|index.html\|unpkg.com\|google.com\|openstreetmap\|ArcGIS\|leaflet" -n app/src/main/java app/src/main/assets || true
          ! grep -R "android.permission.INTERNET" -n app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Terrain-Radar-V54-Native-Offline-APK
          path: app/build/outputs/apk/debug/*.apk
