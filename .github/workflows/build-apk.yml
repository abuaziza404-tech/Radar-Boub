name: Build BOUH Radar V55 Restored APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK from source or ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate and prepare project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE=""
          for f in BOUH_TERRAIN_RADAR_V55*.zip BOUH_TERRAIN_RADAR*.zip *.zip; do
            if ls $f >/dev/null 2>&1; then
              ZIP_FILE=$(ls $f | head -n 1)
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android Gradle project and no ZIP package found in repository root."
            exit 1
          fi

          rm -rf build_src
          mkdir -p build_src
          unzip -q "$ZIP_FILE" -d build_src

          PROJECT_DIR=""
          if [ -f build_src/settings.gradle ] || [ -f build_src/settings.gradle.kts ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/build_src"
          else
            FOUND=$(find build_src -maxdepth 3 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found after unzip."
            find build_src -maxdepth 4 -type f | sort | head -n 200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify V55 restored radar/map package
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f settings.gradle -o -f settings.gradle.kts
          test -f build.gradle -o -f build.gradle.kts
          test -f app/build.gradle -o -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/databases/BOUH_V30_REAL_3ZONES.db
          test -f app/src/main/assets/offline_layers/center_offline_rgb.jpg
          test -f app/src/main/java/com/bouh/terrainradar/v41/MainActivity.java
          if grep -R "android.permission.INTERNET" -n app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission must not exist in V55 restored offline package."
            exit 1
          fi
          if grep -R "unpkg.com\|google.com/maps\|tile.openstreetmap.org\|ArcGIS/rest/services" -n app/src/main/assets/index.html; then
            echo "ERROR: external map dependency found in index.html."
            exit 1
          fi
          grep -n "versionCode\|versionName\|applicationId" app/build.gradle || true

      - name: Validate radar SQLite database
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          sudo apt-get update
          sudo apt-get install -y sqlite3
          DB="app/src/main/assets/databases/BOUH_V30_REAL_3ZONES.db"
          RESULT=$(sqlite3 "$DB" 'PRAGMA integrity_check;')
          echo "SQLite integrity_check: $RESULT"
          if [ "$RESULT" != "ok" ]; then exit 1; fi
          sqlite3 "$DB" 'SELECT COUNT(*) AS cells_count FROM cells;'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Terrain-Radar-V55-Restored-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
