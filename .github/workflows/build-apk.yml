name: Build BOUH Native Offline APK Auto Extract

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build native offline APK from ZIP or source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate and prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_src
          mkdir -p build_src

          # Case 1: repository root already contains a Gradle Android project
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Gradle project found in repository root."
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          # Case 2: repository root contains the packaged BOUH ZIP
          ZIP_FILE=""
          for f in \
            BOUH_TERRAIN_RADAR_V54_NATIVE_OFFLINE_NO_HTML_GITHUB_ROOT_READY.zip \
            BOUH_TERRAIN_RADAR_V54*.zip \
            BOUH_TERRAIN_RADAR*.zip \
            *.zip
          do
            if ls $f >/dev/null 2>&1; then
              ZIP_FILE=$(ls $f | head -n 1)
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Gradle project and no BOUH ZIP file found in repository root."
            echo "Upload the V54 ZIP to the repository root or extract its contents there."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build_src

          if [ ! -f "build_src/settings.gradle" ] && [ ! -f "build_src/settings.gradle.kts" ]; then
            echo "ERROR: ZIP extracted, but no settings.gradle/settings.gradle.kts was found."
            echo "ZIP contents:"
            find build_src -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/build_src" >> "$GITHUB_ENV"

      - name: Verify native no-HTML architecture
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test ! -f app/src/main/assets/index.html
          if grep -R "WebView\|loadUrl\|index.html\|unpkg.com\|google.com\|openstreetmap\|ArcGIS\|leaflet" -n app/src/main/java app/src/main/assets 2>/dev/null; then
            echo "ERROR: Web/HTML dependency found."
            exit 1
          fi
          if grep -R "android.permission.INTERNET" -n app/src/main/AndroidManifest.xml 2>/dev/null; then
            echo "ERROR: INTERNET permission found."
            exit 1
          fi
          test -f app/src/main/assets/databases/BOUH_V30_REAL_3ZONES.db
          echo "Native offline architecture verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-Terrain-Radar-V54-Native-Offline-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
