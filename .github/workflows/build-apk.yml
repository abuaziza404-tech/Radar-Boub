name: Build BOUH Terrain Maps V62 Klemm 237 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ZIP_NAME: BOUH_TERRAIN_MAPS_V62_KLEMM_237_REAL_LAYER_ONLY_GITHUB_ROOT_READY.zip

jobs:
  build-apk:
    name: Build V62 Klemm 237 Maps APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate ZIP package
        id: locate_zip
        shell: bash
        run: |
          set -e
          ZIP_FILE=""
          if [ -f "./${ZIP_NAME}" ]; then
            ZIP_FILE="./${ZIP_NAME}"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*V62*KLEMM*237*.zip' | head -n 1)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No V62 Klemm 237 ZIP found. Upload ${ZIP_NAME} to repository root."
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted_app
          mkdir -p extracted_app
          unzip -q "${{ steps.locate_zip.outputs.zip_file }}" -d extracted_app
          find extracted_app -maxdepth 4 -type f | sort | head -n 160

      - name: Locate Gradle project
        id: locate_project
        shell: bash
        run: |
          set -e
          PROJECT_DIR="$(find extracted_app -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -exec dirname {} \; | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found inside ZIP."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate Klemm 237 layer
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -e
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          JSON_FILE="$(find app/src/main/assets -type f -name 'klemm_sites_237.json' | head -n 1)"
          CSV_FILE="$(find app/src/main/assets -type f -name 'klemm_sites_237.csv' | head -n 1)"

          if [ -z "$JSON_FILE" ]; then
            echo "ERROR: klemm_sites_237.json not found inside app assets."
            exit 1
          fi

          if [ -z "$CSV_FILE" ]; then
            echo "ERROR: klemm_sites_237.csv not found inside app assets."
            exit 1
          fi

          echo "Found JSON: $JSON_FILE"
          echo "Found CSV: $CSV_FILE"

          python3 - <<'PY'
          import json, csv, pathlib, sys

          assets = pathlib.Path("app/src/main/assets")
          json_files = list(assets.rglob("klemm_sites_237.json"))
          csv_files = list(assets.rglob("klemm_sites_237.csv"))

          if not json_files or not csv_files:
              raise SystemExit("Klemm files missing")

          data = json.loads(json_files[0].read_text(encoding="utf-8"))
          if isinstance(data, dict):
              if "sites" in data:
                  sites = data["sites"]
              elif "features" in data:
                  sites = data["features"]
              else:
                  sites = list(data.values())
          else:
              sites = data

          with csv_files[0].open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          print("Klemm JSON count:", len(sites))
          print("Klemm CSV count:", len(rows))

          if len(sites) != 237:
              raise SystemExit(f"ERROR: JSON count is {len(sites)}, expected 237")
          if len(rows) != 237:
              raise SystemExit(f"ERROR: CSV count is {len(rows)}, expected 237")

          bad = []
          for i, row in enumerate(rows, 1):
              lat = row.get("lat") or row.get("latitude")
              lon = row.get("lon") or row.get("lng") or row.get("longitude")
              if lat in (None, "") or lon in (None, ""):
                  bad.append(i)
                  continue
              try:
                  float(lat); float(lon)
              except Exception:
                  bad.append(i)

          if bad:
              raise SystemExit(f"ERROR: rows with invalid coordinates: {bad[:20]}")

          print("Klemm 237 validation OK")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -e
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew clean :app:assembleDebug --stacktrace
          else
            gradle clean :app:assembleDebug --stacktrace
          fi

      - name: Locate APK
        id: locate_apk
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -e
          APK_FILE="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi
          echo "apk_file=${{ steps.locate_project.outputs.project_dir }}/$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-MAPS-V62-KLEMM-237-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_file }}
          if-no-files-found: error
