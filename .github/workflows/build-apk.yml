name: Build BOUH Terrain Radar V57 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build V57 Predictive Radar HD Telescope APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto extract BOUH V57 package if uploaded as ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=""
          for f in BOUH_TERRAIN_RADAR_V57_PREDICTIVE_RADAR_HD_TELESCOPE_LIGHT_GITHUB_ROOT_READY.zip BOUH_TERRAIN_RADAR_V57*.zip BOUH_TERRAIN_RADAR*.zip; do
            if [ -f "$f" ]; then ZIP_FILE="$f"; break; fi
          done
          if [ -n "$ZIP_FILE" ]; then
            echo "Found package: $ZIP_FILE"
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
            shopt -s dotglob
            cp -R extracted/* .
          else
            echo "No ZIP package found; building current repository files."
          fi
          ls -la
          test -f settings.gradle || (echo "settings.gradle not found" && exit 1)
          test -f build.gradle || (echo "root build.gradle not found" && exit 1)
          test -f app/build.gradle || (echo "app/build.gradle not found" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH_Terrain_Radar_V57_Predictive_Radar_HD_Telescope_APK
          path: app/build/outputs/apk/debug/*.apk
